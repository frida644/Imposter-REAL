<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposter</title>
<style>
  :root {
    --bg: #14151c;
    --card: #1f2130;
    --card-2: #2a2d42;
    --text: #f2f3f8;
    --muted: #8d91a8;
    --accent: #6c7bff;
    --danger: #ff5c6c;
    --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 440px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 2rem; letter-spacing: 1px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .row { display: flex; gap: 8px; }
  input[type="text"], select {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: var(--card-2);
    color: var(--text);
    font-size: 1rem;
  }
  select { width: 100%; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--card-2); }
  button.danger { background: var(--danger); }
  button.big { width: 100%; padding: 16px; font-size: 1.1rem; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* Sprachumschalter */
  .lang { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .lang button { padding: 6px 14px; font-size: 0.9rem; background: var(--card-2); color: var(--muted); }
  .lang button.active { background: var(--accent); color: #fff; }

  ul.players { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.players li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  ul.players li span { word-break: break-word; }
  ul.players li button { padding: 6px 10px; background: transparent; color: var(--danger); font-size: 1.1rem; }
  .empty { color: var(--muted); margin: 12px 0 0; font-size: 0.95rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
  .error { color: var(--danger); min-height: 1.3em; margin: 0 0 8px; text-align: center; font-size: 0.95rem; }

  /* Aufdecken */
  .counter { text-align: center; color: var(--muted); margin-bottom: 8px; }
  .player-name { text-align: center; font-size: 1.8rem; font-weight: 700; margin: 0 0 18px; word-break: break-word; }
  .word-box {
    position: relative;
    background: var(--card);
    border-radius: 16px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .word-text { font-size: 2.2rem; font-weight: 800; word-break: break-word; }
  .word-text.imposter { color: var(--danger); }
  .cover {
    position: absolute;
    inset: 0;
    background: #3a3d52;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cover.hidden { display: none; }

  /* Spiel läuft */
  .playing { text-align: center; padding: 30px 18px; }
  .playing h2 { font-size: 1.6rem; margin-bottom: 8px; }
  .playing p { color: var(--muted); margin: 0; }
  .result { text-align: center; margin-bottom: 16px; }
  .result .label { color: var(--muted); margin-bottom: 8px; }
  .result .names { font-size: 1.8rem; font-weight: 800; color: var(--danger); word-break: break-word; }
  .result .word { margin-top: 14px; color: var(--muted); }
  .result .word b { color: var(--ok); }
</style>
</head>
<body>
<div class="app">
  <h1>IMPOSTER</h1>
  <p class="sub" data-i18n="subtitle"></p>

  <!-- EINSTELLUNGEN -->
  <section id="screen-setup" class="screen active">
    <div class="lang">
      <button type="button" id="lang-de">Deutsch</button>
      <button type="button" id="lang-en">English</button>
    </div>

    <div class="panel">
      <h2 data-i18n="players"></h2>
      <div class="row">
        <input type="text" id="name-input" data-i18n-ph="namePlaceholder" maxlength="20" autocomplete="off">
        <button type="button" id="add-btn" data-i18n="add"></button>
      </div>
      <ul id="player-list" class="players"></ul>
      <p id="empty-msg" class="empty" data-i18n="noPlayers"></p>
    </div>

    <div class="panel">
      <h2 data-i18n="options"></h2>
      <div class="field">
        <label for="imposter-count" data-i18n="imposterCount"></label>
        <select id="imposter-count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label for="category" data-i18n="category"></label>
        <select id="category"></select>
      </div>
    </div>

    <p id="setup-error" class="error"></p>
    <button id="start-btn" class="big" data-i18n="startGame"></button>
  </section>

  <!-- AUFDECKEN -->
  <section id="screen-reveal" class="screen">
    <div class="counter" id="reveal-counter"></div>
    <div class="player-name" id="reveal-name"></div>
    <div class="word-box">
      <div class="word-text" id="reveal-word"></div>
      <div class="cover" id="reveal-cover" data-i18n="covered"></div>
    </div>
    <div class="stack">
      <button id="open-btn" class="big" data-i18n="open"></button>
      <button id="hide-btn" class="big secondary" style="display:none" data-i18n="hide"></button>
      <button id="next-btn" class="big" style="display:none"></button>
    </div>
  </section>

  <!-- SPIEL LÄUFT -->
  <section id="screen-playing" class="screen">
    <div class="panel playing" id="playing-panel">
      <h2 data-i18n="gameRunning"></h2>
      <p id="playing-text"></p>
    </div>
    <div id="result" class="panel result" style="display:none">
      <div class="label" id="result-label"></div>
      <div class="names" id="result-names"></div>
      <div class="word"><span data-i18n="wordWas"></span> <b id="result-word"></b></div>
    </div>
    <div class="stack">
      <button id="show-btn" class="big danger" data-i18n="showImposter"></button>
      <button id="again-btn" class="big" style="display:none" data-i18n="newRound"></button>
      <button id="end-btn" class="big secondary" data-i18n="endGame"></button>
    </div>
  </section>
</div>

  const screens = { setup: $("screen-setup"), reveal: $("screen-reveal"), playing: $("screen-playing") };

  function t(key, vars) {
    let s = TEXT[lang][key] || key;
    if (vars) Object.keys(vars).forEach(k => { s = s.split("{" + k + "}").join(vars[k]); });
    return s;
  }

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
  }

  // ---- Sprache ----
  function fillCategories() {
    const sel = $("category");
    const previous = sel.value || RANDOM_ID;
    sel.innerHTML = "";
    const first = document.createElement("option");
    first.value = RANDOM_ID;
    first.textContent = t("random");
    sel.appendChild(first);
    CATEGORIES.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name[lang];
      sel.appendChild(o);
    });
    sel.value = previous;
  }

    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    $("lang-de").classList.toggle("active", lang === "de");
    $("lang-en").classList.toggle("active", lang === "en");
    $("playing-text").textContent = "";
    $("setup-error").textContent = "";
    fillCategories();
    renderPlayers();
  }

  function setLanguage(l) {
    lang = l;
    try { localStorage.setItem("imposter-lang", l); } catch (e) {}
    applyLanguage();
  }
  $("lang-de").addEventListener("click", () => setLanguage("de"));
  $("lang-en").addEventListener("click", () => setLanguage("en"));

  // ---- Spieler ----
  function renderPlayers() {
    const list = $("player-list");
    list.innerHTML = "";
    players.forEach((name, i) => {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = name;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "✕";
      btn.setAttribute("aria-label", t("remove", { name: name }));
      btn.onclick = () => { players.splice(i, 1); renderPlayers(); };
      li.append(span, btn);
      list.appendChild(li);
    });
    $("empty-msg").style.display = players.length ? "none" : "block";
  }

  function addPlayer() {
    const input = $("name-input");
    const name = input.value.trim();
    if (!name) return;
    if (players.some(p => p.toLowerCase() === name.toLowerCase())) {
      $("setup-error").textContent = t("errDuplicate");
      return;
    }
    $("setup-error").textContent = "";
    players.push(name);
    input.value = "";
    input.focus();
    renderPlayers();
  }
  $("add-btn").addEventListener("click", addPlayer);
  $("name-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addPlayer(); }
  });

  // ---- Spiel starten ----
  function shuffled(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickWord() {
    const id = $("category").value;
    const pool = id === RANDOM_ID
      ? CATEGORIES.flatMap(c => c.words[lang])
      : CATEGORIES.find(c => c.id === id).words[lang];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function startGame() {
    const err = $("setup-error");
    if (players.length < 3) { err.textContent = t("errMinPlayers"); return; }
    const count = parseInt($("imposter-count").value, 10);
    if (count >= players.length) { err.textContent = t("errTooMany"); return; }
    const id = $("category").value;
    if (id !== RANDOM_ID) {
      const cat = CATEGORIES.find(c => c.id === id);
      if (cat.words[lang].length === 0) {
        err.textContent = t("errEmptyCat", { cat: cat.name[lang] });
        return;
      }
    }
    err.textContent = "";

    const impostersIdx = shuffled(players.length).slice(0, count);
    state = {
      word: pickWord(),
      imposters: new Set(impostersIdx),
      index: 0,
      order: shuffled(players.length)
    };
    showPlayerTurn();
    show("reveal");
  }
  $("start-btn").onclick = startGame;

  // ---- Wort aufdecken ----
  function showPlayerTurn() {
    const i = state.index;
    const p = state.order[i];
    $("reveal-counter").textContent = t("playerOf", { a: i + 1, b: players.length });
    $("reveal-name").textContent = players[p];
    const w = $("reveal-word");
    if (state.imposters.has(p)) {
      w.textContent = t("imposterWord");
      w.classList.add("imposter");
    } else {
      w.textContent = state.word;
      w.classList.remove("imposter");
    }
    $("reveal-cover").classList.remove("hidden");
    $("open-btn").style.display = "";
    $("hide-btn").style.display = "none";
    $("next-btn").style.display = "none";
  }

  $("open-btn").onclick = () => {
    $("reveal-cover").classList.add("hidden");
    $("open-btn").style.display = "none";
    $("hide-btn").style.display = "";
  };

  $("hide-btn").onclick = () => {
    $("reveal-cover").classList.remove("hidden");
    $("hide-btn").style.display = "none";
    const last = state.index === players.length - 1;
    $("next-btn").textContent = last ? t("beginGame") : t("nextPlayer");
    $("next-btn").style.display = "";
  };

  $("next-btn").onclick = () => {
    if (state.index < players.length - 1) {
      state.index++;
      showPlayerTurn();
    } else {
      $("result").style.display = "none";
      $("playing-panel").style.display = "";
      $("show-btn").style.display = "";
      $("again-btn").style.display = "none";
      const starter = players[Math.floor(Math.random() * players.length)];
      $("playing-text").textContent = t("startsFirst", { name: starter });
      show("playing");
    }
  };

  // ---- Spiel läuft ----
  $("show-btn").onclick = () => {
    const names = [...state.imposters].sort((a, b) => a - b).map(i => players[i]);
    $("result-label").textContent = names.length > 1 ? t("impostersAre") : t("imposterIs");
    $("result-names").textContent = names.join(" & ");
    $("result-word").textContent = state.word;
    $("playing-panel").style.display = "none";
    $("result").style.display = "";
    $("show-btn").style.display = "none";
    $("again-btn").style.display = "";
  };

  $("again-btn").onclick = startGame;

  $("end-btn").onclick = () => {
    state = null;
    show("setup");
  };

  // ---- Start ----
  try {
    const saved = localStorage.getItem("imposter-lang");
    if (saved === "de" || saved === "en") lang = saved;
  } catch (e) {}
  applyLanguage();
</script>
</body>
</html>
